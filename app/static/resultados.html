<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados · Funda Detective</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.fila{cursor:pointer}</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <span class="navbar-brand">🕵️ Funda Detective · Resultados</span>
    <div>
      <a href="/" class="btn btn-sm btn-info me-2">← Dashboard IPPM</a>
      <button id="salir" class="btn btn-sm btn-outline-light">Salir</button>
    </div>
  </div>
</nav>

<div class="container-fluid">
  <div class="row g-3 mb-3 text-center">
    <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
      <div class="text-muted small">Participantes</div><div id="k-n" class="display-6 fw-bold">0</div></div></div></div>
    <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
      <div class="text-muted small">Promedio de puntos</div><div id="k-prom" class="display-6 fw-bold text-primary">–</div></div></div></div>
    <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
      <div class="text-muted small">Puntaje máximo posible</div><div id="k-max" class="display-6 fw-bold text-success">–</div></div></div></div>
  </div>

  <div id="podio" class="row g-3 mb-3"></div>

  <div class="card shadow-sm mb-3">
    <div class="card-body d-flex flex-wrap gap-2 align-items-center">
      <input id="buscar" class="form-control" style="max-width:300px" placeholder="Buscar por nombre...">
      <button id="actualizar" class="btn btn-primary">Actualizar</button>
      <a href="/resultados/csv" class="btn btn-success ms-auto">⬇ Exportar CSV</a>
      <button id="borrar" class="btn btn-danger">🗑 Borrar todo</button>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead><tr>
          <th>#</th><th>Nombre</th><th class="text-end">Total</th><th class="text-end">Aciertos</th>
          <th class="text-end">Errores</th><th class="text-end">Funda 1</th><th class="text-end">Funda 2</th>
          <th class="text-end">Funda 3</th><th>Enviado</th>
        </tr></thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  </div>
  <div class="text-muted small mt-2 mb-4">Clic en una fila para ver las respuestas. Empates: gana quien envió primero.</div>
</div>

<script>
const _fetch = window.fetch;
window.fetch = async (...a) => {
  const r = await _fetch(...a);
  if (r.status === 401) location.href = "/login";
  return r;
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MEDALLA = { 1: "🥇", 2: "🥈", 3: "🥉" };

let datos = { maximo: 0, filas: [] };
const abiertos = new Set();

function lista(titulo, items, icono) {
  if (!items.length) return "";
  return `<div class="small"><b>${icono} ${titulo}:</b> ${items.map(esc).join(" · ")}</div>`;
}

function detalleHtml(f) {
  return Object.values(f.detalle).map((d) => `
    <div class="mb-2"><b>${esc(d.titulo)}</b> <span class="badge bg-secondary">${d.puntos} pts</span>
      ${lista("Aciertos", d.aciertos, "✅")}
      ${lista("Marcó y no existe", d.errores, "❌")}
      ${lista("Sin marcar", d.omitidos, "😶")}
    </div>`).join("");
}

function render() {
  const filas = datos.filas;
  $("k-n").textContent = filas.length;
  $("k-max").textContent = datos.maximo;
  $("k-prom").textContent = filas.length
    ? (filas.reduce((a, f) => a + f.total, 0) / filas.length).toLocaleString("es-AR", { maximumFractionDigits: 1 })
    : "–";

  $("podio").innerHTML = filas.slice(0, 3).map((f) => `
    <div class="col-md-4"><div class="card shadow-sm text-center border-warning">
      <div class="card-body"><div style="font-size:2.5rem">${MEDALLA[f.posicion]}</div>
        <div class="fw-bold fs-5">${esc(f.nombre)}</div>
        <div class="display-6 text-primary">${f.total} pts</div></div></div></div>`).join("");

  const q = $("buscar").value.trim().toLowerCase();
  const vis = filas.filter((f) => f.nombre.toLowerCase().includes(q));
  $("tabla").innerHTML = vis.length ? vis.map((f) => `
    <tr class="fila" data-pos="${f.posicion}">
      <td>${MEDALLA[f.posicion] || f.posicion}</td><td class="fw-semibold">${esc(f.nombre)}</td>
      <td class="text-end fw-bold">${f.total}</td><td class="text-end">${f.aciertos}</td>
      <td class="text-end">${f.errores}</td><td class="text-end">${f.f1}</td>
      <td class="text-end">${f.f2}</td><td class="text-end">${f.f3}</td><td>${esc(f.fecha)}</td></tr>
    <tr class="bg-light" data-det="${f.posicion}" ${abiertos.has(f.posicion) ? "" : "hidden"}>
      <td></td><td colspan="8">${detalleHtml(f)}</td></tr>`).join("")
    : `<tr><td colspan="9" class="text-muted">Sin resultados</td></tr>`;
}

$("tabla").addEventListener("click", (e) => {
  const tr = e.target.closest("tr.fila");
  if (!tr) return;
  const pos = +tr.dataset.pos;
  const det = document.querySelector(`tr[data-det="${pos}"]`);
  det.hidden = !det.hidden;
  det.hidden ? abiertos.delete(pos) : abiertos.add(pos);
});

async function borrarTodo() {
  const n = datos.filas.length;
  if (!n) return alert("No hay resultados para borrar.");
  if (!confirm(`Vas a borrar los ${n} resultados del desafío. Esto NO se puede deshacer.\n\n¿Ya exportaste el CSV?`)) return;
  const t = prompt('Para confirmar, escribí BORRAR en mayúsculas:');
  if (t !== "BORRAR") return alert("Cancelado: no se borró nada.");
  const r = await fetch("/resultados/borrar", { method: "DELETE" });
  if (!r.ok) return alert("No se pudo borrar.");
  abiertos.clear();
  await cargar();
  alert("Resultados borrados.");
}
$("borrar").onclick = borrarTodo;

async function cargar() {
  const r = await fetch("/resultados/datos");
  if (!r.ok) return;
  datos = await r.json();
  render();
}

$("buscar").addEventListener("input", render);
$("actualizar").onclick = cargar;
$("salir").onclick = async () => {
  await fetch("/logout", { method: "POST" });
  location.href = "/login";
};
cargar();
setInterval(cargar, 30000);
</script>
</body>
</html>
